<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Andon Board</title><link rel="stylesheet" href="/static/style.css"></head><body class="login-page"><div class="login-card"><div class="login-brand">PT. DHARMA PRECISION PARTS</div><h1>ANDON BOARD</h1><p class="login-subtitle">Silakan login untuk mengakses sistem.</p>{% if error %}<div class="login-error">{{ error }}</div>{% endif %}<form method="post" class="login-form" autocomplete="on"><label><span>Username</span><input type="text" name="username" autocomplete="username" required autofocus></label><label><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label><button type="submit">LOGIN</button></form><div class="login-note">Akses Dashboard dan Setting tersedia setelah login.</div></div></body></html>
